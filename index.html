<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="书房">
<meta name="theme-color" content="#f6f1e7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>书房</title>
</head>
<body>

<!-- 书架 -->
<section id="shelf" class="page active">
  <header class="bar">
    <h1>书房</h1>
    <div class="bar-actions">
      <button id="btnSync" class="txt-btn" hidden>同步</button>
      <button id="btnManage" class="txt-btn">管理</button>
      <button id="btnDone" class="txt-btn on" hidden>完成</button>
      <label class="txt-btn primary">导入
        <input id="fileInput" type="file" accept=".txt,.epub,.json,text/plain,application/epub+zip,application/json" multiple hidden>
      </label>
    </div>
  </header>
  <div id="recent" class="recent" hidden></div>
  <div id="books" class="books"></div>
  <div id="empty" class="empty" hidden>
    <p>书架还是空的</p>
    <button id="emptyBtn" class="empty-btn"></button>
    <p class="sub">也可以点右上角「导入」，选手机里的 txt 或 epub</p>
  </div>
</section>

<!-- 阅读 -->
<section id="reader" class="page">
  <div id="readTop" class="read-top">
    <button id="btnBack" class="icon-btn" aria-label="返回">‹</button>
    <div id="readTitle" class="read-title"></div>
    <button id="btnReadMore" class="icon-btn more" aria-label="更多">⋯</button>
    <button id="btnToc" class="icon-btn" aria-label="目录">☰</button>
  </div>
  <div id="scroller" class="scroller">
    <article id="content" class="content"></article>
  </div>
  <div id="readInfo" class="read-info"><span id="infoChap"></span><span id="infoPct"></span></div>
  <div id="readBottom" class="read-bottom">
    <div class="row">
      <button id="btnPrev" class="txt-btn">上一章</button>
      <input id="chapSlider" type="range" min="0" max="0" value="0">
      <button id="btnNext" class="txt-btn">下一章</button>
    </div>
    <div class="row tools">
      <button class="tool" id="tToc"><b>☰</b>目录</button>
      <button class="tool" id="tLight"><b>☼</b>亮度</button>
      <button class="tool" id="tFont"><b>Aa</b>字体排版</button>
      <button class="tool" id="tNight"><b id="tNightIco">☾</b><span id="tNightTxt">夜间</span></button>
    </div>
  </div>

  <div id="panel" class="panel">
    <div id="pLight" class="pane">
      <div class="prow"><span class="pl">亮度</span><span class="ico">☼</span><input type="range" id="sBright" min="25" max="100" step="1"><span class="ico big">☀</span></div>
      <div class="prow"><span class="pl">护眼</span><input type="checkbox" class="sw" id="sWarm"><input type="range" id="sWarmLv" min="5" max="45" step="1"><span class="val">暖</span></div>
      <div class="prow"><span class="pl">跟随系统</span><span class="hint">手机切到深色模式时，自动用夜间</span><input type="checkbox" class="sw" id="sAuto"></div>
      <div class="prow wrap"><span class="pl">背景</span><div id="themeList" class="themes2"></div></div>
      <div class="pnote">亮度是书房自己调暗，手机本身的亮度在控制中心调。</div>
    </div>
    <div id="pType" class="pane">
      <div class="prow"><span class="pl">字号</span><button class="stepbtn" data-fs="-1">A−</button><span id="fsVal" class="val mid"></span><button class="stepbtn" data-fs="1">A+</button></div>
      <div class="prow wrap"><span class="pl">中文字体</span><div id="fontList" class="fontlist"></div></div>
      <div class="prow wrap"><span class="pl">英文字体</span><div id="enList" class="fontlist en"></div></div>
      <div class="prow"><span class="pl">行距</span><input type="range" id="sLh" min="1.3" max="2.6" step="0.05"><span id="vLh" class="val"></span></div>
      <div class="prow"><span class="pl">段距</span><input type="range" id="sPg" min="0" max="2" step="0.1"><span id="vPg" class="val"></span></div>
      <div class="prow"><span class="pl">字距</span><input type="range" id="sLs" min="0" max="0.2" step="0.01"><span id="vLs" class="val"></span></div>
      <div class="prow"><span class="pl">边距</span><input type="range" id="sPad" min="8" max="48" step="2"><span id="vPad" class="val"></span></div>
      <div class="prow"><span class="pl">翻页</span><div class="seg"><button data-mode="tap">点击翻页</button><button data-mode="scroll">上下滚动</button></div></div>
      <div class="prow end"><button id="sReset" class="txt-btn">排版恢复默认</button></div>
    </div>
  </div>
</section>

<!-- 目录 -->
<div id="tocMask" class="mask"></div>
<aside id="toc" class="toc">
  <div class="toc-head"><span id="tocBook"></span><button id="tocJump" class="txt-btn">定位</button></div>
  <ol id="tocList"></ol>
</aside>

<div id="sheet" class="sheet">
  <div class="sheet-box">
    <div class="sheet-group"><div class="sheet-title"></div><div class="sheet-list"></div></div>
    <button class="sheet-cancel">取消</button>
  </div>
</div>

<div id="keyDlg" class="keydlg">
  <div class="keybox">
    <div class="keytitle">同步密钥</div>
    <div class="keysub">填电脑上「密钥.txt」里的那串字，大小写和横线都无所谓。填一次就行，以后打开书房会自动拿到新章节。</div>
    <input id="keyInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX">
    <div class="keybtns"><button id="keyCancel">取消</button><button id="keyOk" class="ok">好</button></div>
  </div>
</div>

<div id="pickDlg" class="pickdlg">
  <div class="keybox">
    <div class="keytitle">同步哪些书</div>
    <div class="keysub">电脑上的书都在这里。打开的会同步进书房；关掉的不会，书架上已有的会移走，阅读进度留着。</div>
    <div id="pickList" class="picklist"></div>
    <div class="keybtns"><button id="pickRescan">重新扫描</button><button id="pickLater">以后再说</button><button id="pickOk" class="ok">完成</button></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="warm" class="overlay"></div>
<div id="dim" class="overlay"></div>

<script src="zip.js"></script>
<script src="app.js"></script>
</body>
</html>
